name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Put the web files where Capacitor expects them
        run: |
          mkdir -p www
          for f in index.html xlsx.full.min.js; do
            if [ -f "$f" ]; then mv "$f" www/; fi
          done
          ls -la www

      - name: Set the update link
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json"
          echo "Update link: $URL"
          sed -i "s|__DATA_URL__|$URL|" www/index.html
          grep -q "$URL" www/index.html || { echo "Link was not written into www/index.html"; exit 1; }

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tharka-marks-card-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
